<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Expense Tracker</title>
    <link rel="stylesheet" href="auth.css">
</head>

<body>
    <main class="auth-container">
        <h1>Forgot Password?</h1>
        <p>Enter your registered email address. If you have a password-based account, we'll send you a reset link.</p>

        <form id="forgotPasswordForm">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>

            <button type="submit" id="submitBtn">Send Reset Link</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <a href="index.html">Back to Login</a>
    </main>

    <script src="forgot-password.js"></script>
</body>

</html>
