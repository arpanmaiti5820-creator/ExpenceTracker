<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Expense Tracker</title>
    <link rel="stylesheet" href="auth.css">
</head>

<body>
    <main class="auth-container">
        <h1>Reset Password</h1>
        <p>Enter a new password for your Expense Tracker account.</p>

        <form id="resetPasswordForm">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8"
                autocomplete="new-password" required>

            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Enter your password again"
                minlength="8" autocomplete="new-password" required>

            <button type="submit" id="submitBtn">Update Password</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <a href="index.html">Back to Login</a>
    </main>

    <script src="reset-password.js"></script>
</body>

</html>
